<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Fallback values: js/main.js replaces them with the ones in data/info.json -->
  <title>Mariana Fuentes — Diseñadora UX/UI</title>
  <meta name="description" content="Portfolio de Mariana Fuentes, diseñadora UX/UI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- Order matters: main.js uses getInfo() from storage.js,
       effects.js uses the DOM that main.js renders -->
  <script src="js/storage.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/effects.js" defer></script>
</head>
<body>

  <!-- All the content comes from data/info.json and is rendered by js/main.js.
       This file is only the skeleton: one empty container per section. -->

  <a class="skip-link" href="#main">Saltar al contenido</a>

  <!-- ===== CURSOR + SCROLL PROGRESS (decorative, mouse only) ===== -->
  <div class="cursor" aria-hidden="true"><span class="cursor-label"></span></div>
  <div class="scroll-progress" aria-hidden="true"></div>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <a id="logo" class="logo" href="#top"></a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="menu-toggle-text" data-open="Menú" data-close="Cerrar">Menú</span>
      <span class="menu-toggle-icon" aria-hidden="true"></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Navegación principal">
      <ul id="nav-list"></ul>
      <p class="site-nav-footer" id="nav-footer"></p>
    </nav>
  </header>

  <main id="main">
    <noscript>
      <p class="page-status">Este sitio necesita JavaScript para mostrar su contenido.</p>
    </noscript>

    <section id="top" class="hero" aria-labelledby="hero-title"></section>
    <section id="about" class="about" aria-labelledby="about-title"></section>
    <section id="skills" class="skills" aria-labelledby="skills-title"></section>
    <section id="services" class="services" aria-labelledby="services-title"></section>
    <section id="projects" class="projects" aria-labelledby="projects-title"></section>
    <section id="process" class="process" aria-labelledby="process-title"></section>
    <section id="lab" class="lab" aria-labelledby="lab-title"></section>
    <section id="faq" class="faq" aria-labelledby="faq-title"></section>
    <section id="contact" class="contact" aria-labelledby="contact-title"></section>
  </main>

  <!-- ===== PROJECT SIDE PANEL (case studies open here) ===== -->
  <div class="case-backdrop" hidden></div>
  <aside class="case-panel" id="case-panel" aria-label="Caso de estudio" hidden>
    <button class="case-close" type="button">Cerrar <span aria-hidden="true">✕</span></button>
    <div class="case-panel-body"></div>
  </aside>

  <!-- ===== FOOTER ===== -->
  <footer id="site-footer" class="site-footer"></footer>

</body>
</html>
