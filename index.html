<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mariana Fuentes — Creación Digital</title>
  <meta name="description" content="Portafolio de Mariana Fuentes: UI/UX, posters, contenido y 3D.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/portfolio.css">
  <script>
    // Apply the saved theme before paint to avoid a flash
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <!-- Loader: "grabando" mientras se arma la escena -->
  <div class="loader" aria-hidden="true">
    <div class="loader-inner">
      <span class="rec"><i></i>REC</span>
      <span class="loader-time" id="loader-time">00:00:00:00</span>
      <span class="loader-label">Mariana Fuentes</span>
    </div>
  </div>

  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="cursor" aria-hidden="true"><span class="cursor-label">ver</span></div>

  <header class="site-header">
    <a class="logo" href="#top" id="logo">MF</a>
    <nav class="site-nav" aria-label="Principal">
      <a href="#web">Trabajo</a>
      <a href="#contact">Contacto</a>
      <button class="theme-toggle" type="button" aria-label="Cambiar luz (modo claro / oscuro)">
        <span class="bulb" aria-hidden="true"></span><span class="theme-text">Luz</span>
      </button>
    </nav>
  </header>

  <!-- Todo el contenido se genera desde js/data.js -->
  <main id="main"></main>

  <div class="hud" aria-hidden="true">
    <span class="hud-index" id="hud-index">00/06</span>
    <span class="hud-dot"></span>
    <span class="hud-label" id="hud-label">Materia prima</span>
  </div>
  <div class="hud-progress" aria-hidden="true"><span id="hud-bar"></span></div>
</body>
</html>
